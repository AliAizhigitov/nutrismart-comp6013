{% extends 'base.html' %}
{% block title %}Error {{ code }} – NutriSmart{% endblock %}
{% block content %}
<div class="min-vh-100 d-flex align-items-center justify-content-center">
    <div class="text-center">
        <div class="display-1 fw-bold text-muted">{{ code }}</div>
        <p class="lead text-muted mt-2">{{ message }}</p>
        <a href="{{ url_for('dashboard') if user else url_for('index') }}" class="btn btn-primary mt-3">
            <i class="bi bi-house me-1"></i> Go Home
        </a>
    </div>
</div>
{% endblock %}
