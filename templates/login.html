{% extends 'base.html' %}
{% block title %}Log In – NutriSmart{% endblock %}
{% block content %}
<div class="min-vh-100 d-flex align-items-center justify-content-center bg-light py-5">
    <div class="card shadow-sm border-0 ns-auth-card">
        <div class="card-body p-5">
            <div class="text-center mb-4">
                <i class="bi bi-heart-pulse-fill display-5 text-danger"></i>
                <h2 class="fw-bold mt-2">Welcome back</h2>
                <p class="text-muted">Sign in to your NutriSmart account</p>
            </div>

            <form method="POST" action="{{ url_for('login') }}" novalidate>
                <div class="mb-3">
                    <label class="form-label fw-medium">Username or Email</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light"><i class="bi bi-person"></i></span>
                        <input type="text" name="identifier" class="form-control form-control-lg"
                               placeholder="your_username" autocomplete="username" required autofocus>
                    </div>
                </div>
                <div class="mb-4">
                    <label class="form-label fw-medium">Password</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light"><i class="bi bi-lock"></i></span>
                        <input type="password" name="password" class="form-control form-control-lg"
                               placeholder="••••••••" autocomplete="current-password" required>
                    </div>
                </div>
                <button type="submit" class="btn btn-primary btn-lg w-100 fw-semibold">
                    <i class="bi bi-box-arrow-in-right me-2"></i>Sign In
                </button>
            </form>

            <hr class="my-4">
            <p class="text-center text-muted mb-0">
                Don't have an account?
                <a href="{{ url_for('register') }}" class="fw-semibold text-decoration-none">Create one</a>
            </p>
        </div>
    </div>
</div>
{% endblock %}
